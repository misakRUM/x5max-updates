name: Daily compact DPO stop catalog update
on:
  schedule:
    - cron: '18 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-dpo-stop-catalog
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download and validate official DPO stop list
        env:
          CATALOG_DEST: dpo-stops.json
        run: python3 scripts/refresh_dpo_stops.py
      - name: Commit refreshed compact catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dpo-stops.json
          if git diff --cached --quiet; then
            echo "No changes to DPO stop catalog"
          else
            git commit -m "Daily DPO stop catalog refresh"
            git push
          fi
